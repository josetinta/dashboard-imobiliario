<!DOCTYPE html>
<html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard Imobiliário Prime · José Tinta</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#12031a;font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif;color:#f2f2f5}
#stage{position:absolute;left:0;top:0;width:1494px;height:840px;transform-origin:0 0;background:radial-gradient(900px 500px at 15% 100%,#2a0a38,transparent 70%),#14041d;overflow:hidden}
#stage>*,#dyn>*{position:absolute}
#frame{left:10px;top:10px;width:1474px;height:820px;border-radius:28px;background:#000;border:1px solid rgba(255,255,255,.16)}
.cd{background:#1b1b1e;border:1px solid rgba(255,255,255,.1);border-radius:16px;overflow:hidden}
.ct{position:absolute;left:22px;top:16px;font-size:19px;font-weight:600;letter-spacing:-.2px;white-space:nowrap}
.big{font-size:38px;font-weight:700;letter-spacing:-1px;line-height:40px}
.up{color:#22c55e;font-weight:600}.dn{color:#ef4444;font-weight:600}
.mut{color:#9a9aa3}
.mi{display:flex;align-items:center;gap:12px;height:44px;padding:0 14px;border-radius:10px;font-size:15.5px;font-weight:500;color:#d6d6dc;cursor:pointer;margin-bottom:6px;white-space:nowrap}
.mi:hover{background:rgba(255,255,255,.06)}
.mi.on{background:#3b1450;color:#fff}
.mi svg{flex:none}
.chip{display:inline-block;height:30px;line-height:28px;padding:0 14px;margin-right:6px;border-radius:15px;border:1px solid rgba(255,255,255,.18);background:#141416;color:#cfcfd6;font-size:13.5px;font-weight:600;cursor:pointer;user-select:none}
.chip:hover{border-color:#c712d9;color:#fff}
.chip.on{background:#c712d9;border-color:#c712d9;color:#fff}
.fl{font-size:12px;font-weight:600;color:#8d8d96;margin-right:8px;letter-spacing:.5px;text-transform:uppercase}
select.sel{height:30px;padding:0 12px;border-radius:15px;border:1px solid rgba(255,255,255,.18);background:#141416;color:#e8e8ee;font:600 13.5px 'Inter','Segoe UI',Arial;margin-right:6px;cursor:pointer;outline:none}
.pill{display:inline-block;height:30px;line-height:28px;padding:0 14px;margin-left:6px;border-radius:15px;border:1px solid rgba(255,255,255,.22);background:#141416;color:#f2f2f5;font-size:13px;font-weight:600;text-decoration:none}
.pill:hover{background:#c712d9;border-color:#c712d9}
.lang{display:inline-block;width:36px;height:28px;line-height:26px;text-align:center;margin-left:4px;border-radius:14px;border:1px solid rgba(255,255,255,.18);color:#bdbdc6;font-size:12px;font-weight:700;cursor:pointer;background:#141416}
.lang.on{background:#c712d9;border-color:#c712d9;color:#fff}
.btn{display:inline-block;height:38px;line-height:38px;padding:0 24px;border-radius:19px;background:#c712d9;color:#fff;font-size:14.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:#dc2cee}
svg{display:block;overflow:visible}
svg text{font-family:'Inter','Segoe UI',Arial,sans-serif}
.mini{font-size:11px;fill:#85858e}
.bar{transform-box:fill-box;transform-origin:50% 100%;animation:gr .6s ease-out both}
@keyframes gr{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.hb{animation:hb .8s ease-out both;transform-origin:0 50%;transform-box:fill-box}
@keyframes hb{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.ln{stroke-dasharray:2000;stroke-dashoffset:2000;animation:dr 1.3s ease-out forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.tr{display:grid;grid-template-columns:1fr 92px 74px 80px;align-items:center;height:37px;padding:0 22px;font-size:13.5px}
.tr.h{height:26px;font-size:12px;color:#9a9aa3;border-bottom:1px solid rgba(255,255,255,.12);margin:0 22px;padding:0}
.tr>div:not(:first-child){text-align:right}
.tr:not(.h):hover{background:rgba(255,255,255,.04)}
.pop{animation:pop .55s ease-out both}
@keyframes pop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.th{width:34px;height:34px;border-radius:7px;overflow:hidden;flex:none;background:#2a1136}
.th img{width:100%;height:100%;object-fit:cover}
#tip{position:fixed;z-index:90;pointer-events:none;display:none;background:#26102f;border:1px solid #c712d9;color:#fff;font:600 12.5px 'Segoe UI',Arial;padding:5px 9px;white-space:nowrap}
#tbl{position:fixed;inset:0;z-index:80;background:rgba(5,0,10,.82);display:none;align-items:center;justify-content:center}
#tbl.show{display:flex}
#sheet{width:min(1280px,94vw);height:min(720px,88vh);background:#161619;border:1px solid #c712d9;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;font-family:'Segoe UI',Arial,sans-serif}
#sheet .tp{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#22102c;border-bottom:1px solid #4a1a5c}
#sheet .tp b{flex:1;font-size:16px;color:#fff}
#sheet button{height:30px;padding:0 14px;border:1px solid #c712d9;border-radius:15px;background:#2a0f36;color:#fff;font-weight:600;cursor:pointer}
#sheet button:hover{background:#c712d9}
#sheet .scr{flex:1;overflow:auto}
#sheet table{border-collapse:collapse;font-size:12.5px;width:100%}
#sheet th{position:sticky;top:0;background:#2a0f36;color:#f3d6fa;padding:6px 9px;text-align:right;white-space:nowrap;border:1px solid #3d1a4d}
#sheet td{padding:4px 9px;border:1px solid #2a2a30;text-align:right;color:#e2e2e8;white-space:nowrap}
#sheet th:nth-child(-n+4),#sheet td:nth-child(-n+4){text-align:left}
#sheet tr:nth-child(even) td{background:#1c1c20}
</style></head>
<body>
<div id="stage"><div id="frame"></div><div id="dyn" style="left:0;top:0;width:1494px;height:840px"></div></div>
<div id="tip"></div>
<div id="tbl"><div id="sheet"><div class="tp"><b id="shT"></b><span id="shH" style="font-size:12px;color:#d9b8e6"></span><button id="shR"></button><button id="shC"></button><button id="shX"></button></div><div class="scr"><table id="shTab"></table></div></div></div>
